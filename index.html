<!-- index.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Votação 2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-md navbar-dark navbar-farm px-4">
    <div class="container-fluid px-0">
      <a class="navbar-brand fw-bold d-flex align-items-center" href="index.html">
        <img src="img/logo.png" alt="Logo" width="40" height="40" class="me-2 rounded-circle" onerror="this.style.display='none'">
        Votação 2026
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav gap-2">
          <li class="nav-item"><a class="nav-link active px-3" href="index.html">Início</a></li>
          <li class="nav-item"><a class="nav-link px-3" href="votacao.html">Votar</a></li>
          <li class="nav-item"><a class="nav-link px-3" href="resultado.html">Resultado</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <div class="row align-items-center mb-5">
      <div class="col-md-4 text-center mb-4 mb-md-0 position-relative">
        <img src="img/fazendeiro.jpg" alt="Fazendeiro" class="rounded-circle fazendeiro-img mb-3">
        <div class="badge-fazendeiro fs-5 fw-bold position-relative" style="margin-top: -30px; z-index: 2;">
          Fazendeiro João Paulo
        </div>
      </div>
      <div class="col-md-8">
        <div class="card card-cream p-4 p-md-5">
          <h1 class="fw-bold mb-3">Ô de casa! Aqui quem manda é o fazendeiro.</h1>
          <p class="fs-5 mb-4">Falta muito pouco para ver o que rola nessa semana. Só um peão vai pra casa, e quem decide é você. Pode votar quantas vezes quiser.</p>
          <div class="d-flex gap-2">
            <a href="votacao.html" class="btn btn-danger btn-lg fw-bold px-4">Votar agora</a>
            <a href="resultado.html" class="btn btn-dark btn-lg px-4">Ver parcial</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Adicionado para refletir a Figura 1 exatamente -->
    <h3 class="font-serif mb-3">Na roça desta semana</h3>
    <div id="roca-home-container" class="d-flex gap-3 flex-wrap"></div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const naRoca = await getParticipantes(true);
        const container = document.getElementById("roca-home-container");
        naRoca.forEach(p => {
          container.innerHTML += `
            <div class="d-flex align-items-center bg-dark rounded-pill pe-3 border border-secondary" style="background-color: #2b170c !important;">
              <img src="${p.foto}" class="rounded-circle border border-warning" style="width: 45px; height: 45px; object-fit: cover;">
              <span class="text-white ms-2 fw-bold font-serif">${p.nome}</span>
            </div>
          `;
        });
      } catch (e) { console.error(e); }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
