<!-- votacao.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Votação 2026 - Votar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-md navbar-dark navbar-farm px-4">
    <div class="container-fluid px-0">
      <a class="navbar-brand fw-bold d-flex align-items-center" href="index.html">
        <img src="img/logo.png" alt="Logo" width="40" height="40" class="me-2 rounded-circle" onerror="this.style.display='none'">
        Votação 2026
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav gap-2">
          <li class="nav-item"><a class="nav-link px-3" href="index.html">Início</a></li>
          <li class="nav-item"><a class="nav-link active px-3" href="votacao.html">Votar</a></li>
          <li class="nav-item"><a class="nav-link px-3" href="resultado.html">Resultado</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <h2 class="font-serif fw-bold" style="color: #f0b541;">Quem você quer eliminar?</h2>
    <p class="mb-4">Como dita a tradição, em A Fazenda o voto é para eliminar.</p>
    
    <div id="alert-container"></div>

    <div id="roca-container" class="row row-cols-1 row-cols-md-3 g-4 mb-5">
      <!-- Dinâmico -->
    </div>

    <h3 class="font-serif mb-3 text-white-50 border-bottom border-secondary pb-2">Demais peões</h3>
    <div class="mb-2 text-white-50"><small>Estes peões estão na sede e não podem receber votos.</small></div>
    <div id="sede-container" class="row row-cols-3 row-cols-md-6 g-3 peao-grid">
      <!-- Dinâmico -->
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const rocaContainer = document.getElementById("roca-container");
      const sedeContainer = document.getElementById("sede-container");
      const alertContainer = document.getElementById("alert-container");

      try {
        const naRoca = await getParticipantes(true);
        naRoca.forEach(p => {
          const col = document.createElement("div");
          col.className = "col";
          col.innerHTML = `
            <div class="card card-cream h-100 card-roca position-relative">
              <span class="badge position-absolute top-0 end-0 mt-3 me-1 badge-roca text-uppercase fw-bold">Na roça</span>
              <img src="${p.foto}" alt="${p.nome}" class="card-img-top">
              <div class="card-body text-center d-flex flex-column px-2 pb-2 pt-3">
                <h4 class="card-title font-serif fw-bold mb-3">${p.nome}</h4>
                <button class="btn btn-danger w-100 mt-auto fw-bold btn-votar" data-id="${p.id}" data-nome="${p.nome}">Votar para eliminar</button>
              </div>
            </div>
          `;
          rocaContainer.appendChild(col);
        });

        const naSede = await getParticipantes(false);
        naSede.forEach(p => {
          const col = document.createElement("div");
          col.className = "col text-center";
          col.innerHTML = `
            <img src="${p.foto}" alt="${p.nome}">
            <small class="text-white d-block lh-sm">${p.nome}</small>
          `;
          sedeContainer.appendChild(col);
        });

        document.querySelectorAll(".btn-votar").forEach(button => {
          button.addEventListener("click", async (e) => {
            const id = e.target.getAttribute("data-id");
            const nome = e.target.getAttribute("data-nome");

            await registrarVoto(id);
            const votos = await getVotos();
            const qtd = votos.filter(v => v.participanteId == id).length;

            alertContainer.innerHTML = `
              <div class="alert text-dark fw-bold mb-4" style="background-color: #d1e7dd; border-left: 6px solid #198754;" role="alert">
                Voto registrado com sucesso em <strong>${nome}</strong>. Você já votou ${qtd} vez(es).
              </div>
            `;
            window.scrollTo(0, 0);
          });
        });

      } catch (error) { console.error(error); }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
